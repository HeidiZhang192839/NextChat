# Render Blueprint: deploys SearXNG for the web search tool
# (set its URL as SEARXNG_URL in the NextChat deployment)
services:
  - type: web
    name: nextchat-searxng
    runtime: docker
    plan: free
    # dockerfilePath and dockerContext are relative to rootDir
    rootDir: searxng
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SEARXNG_SECRET
        generateValue: true
      - key: PORT
        value: "8080"
